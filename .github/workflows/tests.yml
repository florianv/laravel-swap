name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        exclude:
          # Laravel 11 supports PHP up to 8.4.
          - php: '8.5'
            laravel: '11'
          # Laravel 13 requires PHP 8.3.
          - php: '8.2'
            laravel: '13'

    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Laravel 11 has unpatched security advisories, which Composer refuses to install by default,
      # and the Psalm plugins need Laravel 12+. Psalm runs in its own workflow.
      - name: Prepare Laravel 11
        if: matrix.laravel == '11'
        run: |
          composer config audit.block-insecure false
          composer remove --dev psalm/plugin-laravel psalm/plugin-phpunit vimeo/psalm --no-update --no-interaction

      - name: Pin Laravel ${{ matrix.laravel }}
        run: composer require "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run tests
        run: vendor/bin/phpunit
